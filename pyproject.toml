[project]
name = "clothes-tagging-lab"
version = "0.1.0"
description = "Starter for a clothing image annotation service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -m 'not integration'"
markers = ["integration: requires TEST_DATABASE_URL pointing to a disposable PostgreSQL database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
