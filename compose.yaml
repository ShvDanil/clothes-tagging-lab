services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clothes}
      POSTGRES_USER: ${POSTGRES_USER:-clothes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-clothes}:${POSTGRES_PASSWORD:-local-development-only}@db:5432/${POSTGRES_DB:-clothes}
      TAXONOMY_PATH: data/taxonomy/clothing-v1.json
      MAX_IMAGES_PER_ITEM: ${MAX_IMAGES_PER_ITEM:-5}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_ID: ${MODEL_ID:-}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 10

  tests:
    profiles: ["test"]
    build:
      context: .
      target: test
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-clothes}:${POSTGRES_PASSWORD:-local-development-only}@db:5432/${POSTGRES_DB:-clothes}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
